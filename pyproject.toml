[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptouch-connector"
version = "0.1.0"
description = "Etiketten auf einem Brother PT-P710BT über Bluetooth drucken (macOS)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=10.1", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ptouch = "ptouch_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
